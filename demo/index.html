<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sailwright quick-start demo</title>

    <!-- asciinema-player assets (run ./fetch-player.sh to populate vendor/). -->
    <link rel="stylesheet" href="vendor/asciinema-player.css" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1rem;
        box-sizing: border-box;
        background: #0d1117;
        color: #c9d1d9;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      h1 { font-size: 1.15rem; font-weight: 600; margin: 0; opacity: 0.9; text-align: center; }

      /* Two panels sit side by side on desktop and stack on narrow screens. */
      .stage {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
      }
      .panel { width: min(560px, 94vw); display: flex; flex-direction: column; gap: 0.5rem; }
      .panel h2 {
        font-size: 0.85rem; font-weight: 600; margin: 0;
        color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em;
      }
      .panel video {
        width: 100%; height: auto; border-radius: 6px;
        background: #000; display: block;
      }
      /* Keep the asciinema-player box visually consistent with the video panel. */
      .panel .asciinema-player-wrapper { border-radius: 6px; overflow: hidden; }
    </style>
  </head>
  <body>
    <h1>Sailwright — from zero to a provisioned VM, fully automated</h1>

    <div class="stage">
      <div class="panel">
        <h2>You run the commands</h2>
        <div id="terminal"></div>
      </div>

      <div class="panel">
        <h2>…the VM builds itself, unattended</h2>
        <!-- Generate with `make demo-build-video` on a Linux+KVM host. -->
        <video src="vm-build.mp4" autoplay muted loop playsinline></video>
      </div>
    </div>

    <script src="vendor/asciinema-player.min.js"></script>
    <script>
      AsciinemaPlayer.create("quickstart.cast", document.getElementById("terminal"), {
        autoPlay: true,
        loop: true,
        // Compress the pauses baked into the cast so playback stays snappy.
        idleTimeLimit: 1.5,
        cols: 100,
        rows: 28,
        theme: "asciinema",
        terminalFontSize: "12px",
        poster: "npt:0:02",
      });
    </script>
  </body>
</html>
